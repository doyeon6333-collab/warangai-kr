<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#fff;color:#222428;

    position:relative;overflow:hidden}

  h1{font-size:74px;line-height:1.16;font-weight:800;position:relative}
  h1 .u{position:relative;display:inline-block}
  h1 .u::after{content:"";position:absolute;left:0;right:0;bottom:-0.10em;height:7px;background:rgba(181,18,94,.16)}
  .bot{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid #DCD8D1;padding-top:26px;position:relative}
  .bot .sl{font-size:17px;font-weight:600;color:#5C6068}

  .bot .site{font-size:15px;font-weight:700;letter-spacing:.06em;color:#B5125E}
